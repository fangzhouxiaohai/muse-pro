[package]
name = "muse-pro"
version = "0.1.0"
description = "个人 AI 工作台"
authors = ["Muse Pro"]
edition = "2021"

[lib]
name = "muse_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# 前端 @tauri-apps/plugin-http 目前最新为 2.7.0，这里锁定次版本号以保证两端一致
tauri-plugin-http = "=2.7.0"
tauri-plugin-opener = "2"
